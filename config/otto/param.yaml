# laser_scan_merger_node:
#   ros__parameters:
    # Declare laser scan topics to be subscribed here.
    # Max 9 laser scan topics
    scan_topics: ["/right_lidar/scan", "/left_lidar/scan"]

    # reliability policy ros2 topic: 0=reliable, 1=best effort
    scan_policies: [0, 0]
    output_topic: 'scan_merged'

    # Declare the frame id for output scan, most likely base_link is appropriate.
    merged_frame_id: "base_link"

    tolerance: 0.01
    min_height: 0.14 # default to std::numeric_limits<double>::min() if not given
    max_height: 0.5 # default to std::numeric_limits<double>::max() if not given
    angle_min: -3.14159 # (-2.35619449) --> -135 deg (per SICK driver config)
    angle_max: 3.14159 # (2.35619449) --> 135 deg (per SICK driver config)
    angle_increment: 0.01
    scan_time: 0.0333
    range_min: 0.30
    range_max: 30.0 # default to std::numeric_limits<double>::max() if not given
    inf_epsilon: 1.0

    use_inf: true
    # Queue size for approximate filter
    queue_size: 20

    debug: true
    moving_frames: false
